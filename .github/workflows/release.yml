name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: Build, test and sign both apps (ad-hoc)
        run: scripts/build-and-package.sh
      - name: Zip and checksum
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd artifacts
          zip -qry "DiskCleaner-$TAG.zip" "Disk Cleaner.app" "Disk Cleaner Preview.app"
          shasum -a 256 "DiskCleaner-$TAG.zip" > "DiskCleaner-$TAG.zip.sha256"
      - name: Write release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          {
            awk -v v="$version" '$0 ~ "^## "v" " {p=1; next} /^## /{p=0} p' CHANGELOG.md
            echo
            echo "## Install"
            echo
            echo "These apps are ad-hoc signed and not notarized. Download with the GitHub CLI so macOS does not quarantine them:"
            echo
            echo '```sh'
            echo "gh release download $TAG -R ${{ github.repository }} -p 'DiskCleaner-*'"
            echo "shasum -a 256 -c DiskCleaner-$TAG.zip.sha256"
            echo "unzip DiskCleaner-$TAG.zip"
            echo '```'
            echo
            echo "A browser download is quarantined; remove it with \`xattr -dr com.apple.quarantine \"Disk Cleaner.app\"\` if you trust this build."
          } > release-notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in v0.*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" $prerelease --title "Disk Cleaner ${TAG#v}" --notes-file release-notes.md \
            "artifacts/DiskCleaner-$TAG.zip" "artifacts/DiskCleaner-$TAG.zip.sha256"
